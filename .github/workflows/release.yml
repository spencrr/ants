name: Release

# Cut a release with `node scripts/release.mjs <version>` and push the branch and the tag. Four stages:
#
#   check    the tag is on main or a release/* branch and matches package.json.
#   checks   lint, typecheck and the end-to-end tests, from test.yml: the same steps CI runs on every
#            commit, run again here so the release is tested in its own right rather than trusting
#            an earlier run.
#   build    the third-party build tooling (npm, vsce), with a read-only token.
#   publish  runs no npm code at all. It takes the VSIX from the build job, attests how it was built, and
#            creates the GitHub Release. It holds the only write token, and it waits in the `release`
#            environment for the maintainer's approval first.
#
# Releases are immutable (a repository setting), so the assets and the tag can't change afterwards and GitHub
# signs a release attestation: `gh release verify-asset vX.Y.Z ants-X.Y.Z.vsix`.
on:
  push:
    tags: ["v*.*.*"]

# One run per tag, and never cancelled part-way: a half-published release is worse than a late one.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  check:
    name: Check the tag
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The tag must be on main or a release branch, and match package.json
        run: |
          git fetch --no-tags --depth=200 origin '+refs/heads/main:refs/remotes/origin/main' '+refs/heads/release/*:refs/remotes/origin/release/*'
          on_branch=$(git for-each-ref --format='%(refname:short)' refs/remotes/origin/main 'refs/remotes/origin/release/*' --contains "$GITHUB_SHA")
          if [ -z "$on_branch" ]; then echo "::error::$GITHUB_REF_NAME ($GITHUB_SHA) is not on main or a release/* branch"; exit 1; fi
          echo "On: $on_branch"
          tag="${GITHUB_REF_NAME#v}"
          v=$(node -p "require('./package.json').version")
          if [ "$v" != "$tag" ]; then echo "::error file=package.json::version $v does not match tag $tag"; exit 1; fi

  checks:
    name: Checks
    needs: check
    uses: $/.github/workflows/test.yml
    permissions:
      contents: read

  build:
    name: Build the release
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No npm cache here: a poisoned cache entry would end up inside the published VSIX.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - name: Build the VSIX
        run: |
          mkdir -p artifacts
          npm run package -- --out artifacts/
          ls -l artifacts/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish the GitHub Release
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write # create the release and upload its assets
      id-token: write # sign the provenance attestation through Sigstore
      attestations: write # store it on the repository
    steps:
      # Only for CHANGELOG.md; nothing is built or installed in this job.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ github.sha }}
          path: artifacts/
      # Signed statement that this exact file came out of this workflow at this commit:
      # `gh attestation verify ants-X.Y.Z.vsix --owner spencrr`.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: artifacts/*.vsix
      - name: Release notes from the changelog
        run: |
          tag="${GITHUB_REF_NAME#v}"
          # The section for this version, without its heading, and without the link definitions at the
          # end of the file (the oldest section runs into those). Trailing blank lines go too.
          awk -v v="$tag" '/^## \[/{p=index($0, "[" v "]")>0; if(p){next}} p && (/^## / || /^\[[^]]+\]: /){exit} p' CHANGELOG.md \
            | sed -e :a -e '/^\n*$/{$d;N;ba' -e '}' > notes.md
          [ -s notes.md ] || echo "See CHANGELOG.md." > notes.md
          printf '\n\nInstall the VSIX from the Extensions view (**...** → **Install from VSIX...**). To check it is the file this release published: `gh release verify-asset %s ants-%s.vsix`.\n' "$GITHUB_REF_NAME" "$tag" >> notes.md
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" artifacts/* \
            --title "Ants ${GITHUB_REF_NAME#v}" \
            --notes-file notes.md \
            --verify-tag

  # There is no Marketplace step: vsce refuses to publish an extension with enabledApiProposals, so the proposals
  # would have to move behind a separate build first. When it is time, it belongs in a job like `publish`, with
  # VSCE_PAT as an environment secret.
