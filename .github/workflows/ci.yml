name: CI

on:
  push:
    # release/* branches exist only when a fix has to ship while main carries unfinished work.
    branches: [main, "release/*"]
  pull_request:
  workflow_dispatch:

# A newer run on the same branch supersedes an older one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  # Lint, typecheck and the end-to-end tests live in test.yml, which release.yml runs too. The job names
  # the branch ruleset requires come out as "Checks / Lint and typecheck", "Checks / Test (ubuntu-latest)"
  # and so on.
  checks:
    name: Checks
    uses: $/.github/workflows/test.yml
    permissions:
      contents: read

  build:
    name: Build the VSIX
    runs-on: ubuntu-latest
    needs: checks
    permissions:
      contents: read # checkout
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm run package
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ants-${{ github.sha }}
          path: "*.vsix"
          if-no-files-found: error
          retention-days: 14
