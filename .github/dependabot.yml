version: 2
updates:
  # The runtime dependency (the Anthropic SDK) and the dev tooling, in separate groups so a change that ships in the
  # VSIX is never mixed into a tooling bump.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Wait a week before proposing a freshly published version: compromised releases are usually caught within days.
    cooldown:
      default-days: 7
    groups:
      anthropic-sdk:
        patterns: ["@anthropic-ai/*"]
        # Majors of the SDK are taken deliberately, one at a time.
        update-types: ["minor", "patch"]
      dev-tooling:
        patterns: ["*"]
        exclude-patterns: ["@anthropic-ai/*"]
        # Majors of the tooling are taken deliberately, one at a time.
        update-types: ["minor", "patch"]
    ignore:
      # @types/node tracks the lowest supported Node (engines.node), not the newest release.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # @types/vscode tracks engines.vscode, the oldest VS Code the extension supports.
      - dependency-name: "@types/vscode"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
