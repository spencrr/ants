# Categories for GitHub's generated release notes (used when a release is created without --notes-file).
changelog:
  exclude:
    labels: [skip-changelog]
  categories:
    - title: Breaking changes
      labels: [breaking]
    - title: New
      labels: [enhancement, feature]
    - title: Fixed
      labels: [bug]
    - title: Dependencies
      labels: [dependencies]
    - title: Other
      labels: ["*"]
